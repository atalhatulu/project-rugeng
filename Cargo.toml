[workspace]
resolver = "2"
members = [
    "crates/rugeng_core",
    "crates/rugeng_assets",
    "crates/rugeng_scheduler",
    "crates/rugeng_render",
    "crates/rugeng_physics",
    "crates/rugeng_editor",
    "crates/rugeng_standalone",
    "crates/rugeng_script",
    "games/bullet_hell",
    "games/platformer",
    "games/demo_3d",
]

[workspace.dependencies]
crossbeam-deque = "0.8"
glam = { version = "0.29", features = ["serde"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mlua = { version = "0.12", features = ["luau"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
